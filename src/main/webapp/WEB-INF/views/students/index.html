<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="layout :: content">
<head>
  <title>Danh sách sinh viên</title>
</head>
<body>
<h2 class="mb-3">Danh sách sinh viên</h2>

<!-- Flash message -->
<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

<table class="table table-striped table-bordered">
  <thead class="table-dark">
  <tr>
    <th>Mã số</th>
    <th>Họ tên</th>
    <th>Điểm tổng kết</th>
    <th>Hạng</th>
    <th>Hành động</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="s : ${students}">
    <td th:text="${s.mssv}"></td>
    <td th:text="${s.hoTen}"></td>
    <td th:text="${#numbers.formatDecimal(s.diemTongKet, 0, 'COMMA', 2, 'POINT')}"></td>
    <td><span class="badge bg-info text-dark" th:text="${s.xepLoai.label}"></span></td>
    <td>
      <a th:href="@{/students/{id}(id=${s.mssv})}" class="btn btn-sm btn-info">Chi tiết</a>
      <a th:href="@{/students/{id}/edit(id=${s.mssv})}" class="btn btn-sm btn-warning">Sửa</a>
      <a th:href="@{/students/{id}/delete(id=${s.mssv})}" class="btn btn-sm btn-danger">Xóa</a>
    </td>
  </tr>
  <tr th:if="${#lists.isEmpty(students)}">
    <td colspan="5" class="text-center">Không có sinh viên nào.</td>
  </tr>
  </tbody>
</table>
</body>
</html>
