<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">
<h2>Sửa sinh viên</h2>

<form th:action="@{/students/{id}/edit(id=*{mssv})}" th:object="${studentForm}" method="post">

    <div class="mb-3">
        <label class="form-label">MSSV</label>
        <input type="text" th:field="*{mssv}" class="form-control" readonly="true"/>
    </div>

    <div class="mb-3">
        <label class="form-label">Họ tên</label>
        <input type="text" th:field="*{hoTen}" class="form-control"/>
        <p th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}" class="text-danger"></p>
    </div>

    <div class="mb-3">
        <label class="form-label">Điểm tổng kết</label>
        <input type="number" step="0.01" th:field="*{diemTongKet}" class="form-control"/>
        <p th:if="${#fields.hasErrors('diemTongKet')}" th:errors="*{diemTongKet}" class="text-danger"></p>
    </div>

    <input type="hidden" th:field="*{avatar}" />

    <button type="submit" class="btn btn-primary">Cập nhật</button>
    <a th:href="@{/students}" class="btn btn-secondary">Hủy</a>
</form>
</body>
</html>
