<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thêm sinh viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">

<h2>Thêm sinh viên</h2>

<form th:action="@{/students/add}" th:object="${studentForm}" method="post" class="mt-3" enctype="multipart/form-data">

  <div class="mb-3">
    <label class="form-label">Mã số (MSSV)</label>
    <input type="text" th:field="*{mssv}" class="form-control"/>
    <p th:if="${#fields.hasErrors('mssv')}" th:errors="*{mssv}" class="text-danger"></p>
  </div>

  <div class="mb-3">
    <label class="form-label">Họ tên</label>
    <input type="text" th:field="*{hoTen}" class="form-control"/>
    <p th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}" class="text-danger"></p>
  </div>

  <div class="mb-3">
    <label class="form-label">Điểm tổng kết</label>
    <input type="number" step="0.01" th:field="*{diemTongKet}" class="form-control"/>
    <p th:if="${#fields.hasErrors('diemTongKet')}" th:errors="*{diemTongKet}" class="text-danger"></p>
  </div>

  <div class="mb-3">
    <label class="form-label">Avatar (Ảnh đại diện)</label>
    <input type="file" th:field="*{avatarFile}" class="form-control"/>
  </div>

  <button type="submit" class="btn btn-primary">Lưu</button>
  <a th:href="@{/students}" class="btn btn-secondary">Hủy</a>
</form>

</body>
</html>
