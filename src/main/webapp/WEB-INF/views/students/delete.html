<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xóa sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container mt-4">

<h2 class="mb-4 text-danger">Xác nhận xóa sinh viên</h2>

<div class="alert alert-warning">
    Bạn có chắc chắn muốn xóa sinh viên
    <strong th:text="${student.hoTen}"></strong>
    (MSSV: <span th:text="${student.mssv}"></span>)?
</div>

<div class="card p-3">
    <div class="row g-3 align-items-center">
        <div class="col-md-3 text-center">
            <img th:if="${student.avatar}" th:src="@{${student.avatar}}"
                 style="width: 150px; height: 150px; object-fit: cover; border-radius: 50%;"
                 class="img-fluid" alt="Avatar"/>
            <div th:unless="${student.avatar}" class="d-flex align-items-center justify-content-center bg-light"
                 style="width: 150px; height: 150px; border-radius: 50%;">
                <span class="text-muted">No Photo</span>
            </div>
        </div>
        <div class="col-md-9">
            <table class="table table-borderless">
                <tr>
                    <th>MSSV</th>
                    <td th:text="${student.mssv}"></td>
                </tr>
                <tr>
                    <th>Họ tên</th>
                    <td th:text="${student.hoTen}"></td>
                </tr>
                <tr>
                    <th>Điểm tổng kết</th>
                    <td th:text="${#numbers.formatDecimal(student.diemTongKet,1,2)}"></td>
                </tr>
            </table>
        </div>
    </div>
</div>

<form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" class="mt-3">
    <button type="submit" class="btn btn-danger">Xóa</button>
    <a th:href="@{/students}" class="btn btn-secondary">Hủy</a>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
