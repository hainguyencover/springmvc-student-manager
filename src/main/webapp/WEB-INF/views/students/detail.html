<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thông tin chi tiết sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-4">Thông tin chi tiết sinh viên</h2>

<div th:if="${message}" class="alert alert-info" th:text="${message}"></div>

<div class="card">
    <div class="row g-0">
        <div class="col-md-3 text-center p-3">
            <img th:if="${student.avatar}" th:src="@{${student.avatar}}"
                 style="width: 150px; height: 150px; object-fit: cover; border-radius: 50%;"
                 class="img-fluid rounded-start" alt="Avatar"/>
            <div th:unless="${student.avatar}" class="d-flex align-items-center justify-content-center bg-light"
                 style="width: 150px; height: 150px; border-radius: 50%;">
                <span class="text-muted">No Photo</span>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card-body">
                <h5 class="card-title" th:text="${student.hoTen}"></h5>
                <table class="table table-borderless">
                    <tr>
                        <th style="width: 150px">Mã số sinh viên</th>
                        <td th:text="': ' + ${student.mssv}"></td>
                    </tr>
                    <tr>
                        <th>Điểm tổng kết</th>
                        <td th:text="': ' + ${#numbers.formatDecimal(student.diemTongKet, 1, 2)}"></td>
                    </tr>
                    <tr>
                        <th>Xếp loại</th>
                        <td>: <span class="badge bg-primary" th:text="${student.xepLoai.label}"></span></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="mt-3">
    <a th:href="@{/students}" class="btn btn-secondary">Quay lại danh sách</a>
    <a th:href="@{/students/{id}/edit(id=${student.mssv})}" class="btn btn-warning">Sửa</a>
    <form th:action="@{/students/{id}/delete(id=${student.mssv})}"
          method="post" style="display:inline">
        <button type="submit" class="btn btn-danger">Xóa</button>
    </form>
</div>


</body>
</html>
