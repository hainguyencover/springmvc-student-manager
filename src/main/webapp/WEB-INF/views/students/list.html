<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2 class="mb-3">Danh sách sinh viên</h2>

<div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<!-- Form lọc và tìm kiếm -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <form class="row g-2" method="get" th:action="@{/students}">
        <div class="col-auto">
            <label>
                <input type="text" name="q" class="form-control" placeholder="Tìm MSSV hoặc Họ tên" th:value="${q}"/>
            </label>
        </div>
        <div class="col-auto">
            <label>
                <select name="sort" class="form-select">
                    <option value="mssv" th:selected="${sort == 'mssv'}">Sắp xếp theo MSSV</option>
                    <option value="name" th:selected="${sort == 'name'}">Sắp xếp theo Tên</option>
                    <option value="gpa" th:selected="${sort == 'gpa'}">Sắp xếp theo Điểm</option>
                </select>
            </label>
        </div>
        <div class="col-auto">
            <label>
                <select name="dir" class="form-select">
                    <option value="asc" th:selected="${dir == 'asc'}">Tăng dần</option>
                    <option value="desc" th:selected="${dir == 'desc'}">Giảm dần</option>
                </select>
            </label>
        </div>
        <div class="col-auto">
            <label>
                <select name="size" class="form-select" onchange="this.form.submit()">
                    <option value="5" th:selected="${size == 5}">5</option>
                    <option value="10" th:selected="${size == 10}">10</option>
                    <option value="20" th:selected="${size == 20}">20</option>
                </select>
            </label>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Lọc</button>
        </div>
    </form>
    <a th:href="@{/students/add}" class="btn btn-success">Thêm sinh viên</a>
</div>

<!-- Bảng danh sách sinh viên -->
<table class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
    <tr>
        <th>Mã số</th>
        <th>Avatar</th>
        <th>Họ tên</th>
        <th>Điểm tổng kết</th>
        <th>Hạng</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${students}">
        <td th:text="${s.mssv}"></td>
        <td>
            <img th:if="${s.avatar}" th:src="@{'/uploads/' + ${s.avatar}}"
                 style="width: 50px; height: 50px; object-fit: cover; border-radius: 50%;" alt="Avatar"/>
            <span th:unless="${s.avatar}" class="text-muted">No photo</span>
        </td>
        <td th:text="${s.hoTen}"></td>
        <td th:text="${#numbers.formatDecimal(s.diemTongKet, 1, 2)}"></td>
        <td>
            <span class="badge bg-info text-dark" th:text="${s.xepLoai.label}"></span>
        </td>
        <td>
            <a th:href="@{/students/{id}(id=${s.id})}" class="btn btn-sm btn-info">Chi tiết</a>
            <a th:href="@{/students/{id}/edit(id=${s.id})}" class="btn btn-sm btn-warning">Sửa</a>
            <a th:href="@{/students/{id}/delete(id=${s.id})}" class="btn btn-sm btn-danger">Xóa</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(students)}">
        <td colspan="6" class="text-center">Không có sinh viên nào khớp với tìm kiếm.</td>
    </tr>
    </tbody>
</table>

<!-- === KHU VỰC PHÂN TRANG ĐÃ CẢI TIẾN === -->
<div class="d-flex justify-content-between align-items-center mt-3" th:if="${totalPages > 0}">
    <!-- Thông tin tổng số -->
    <p class="text-muted mb-0" th:text="|Trang ${page} / ${totalPages} (Tổng cộng ${total} sinh viên)|"></p>

    <!-- Các nút chuyển trang -->
    <nav th:if="${totalPages > 1}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${page == 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/students(q=${q}, sort=${sort}, dir=${dir}, page=${page - 1}, size=${size})}">«</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == page ? 'active' : ''}">
                <a class="page-link" th:href="@{/students(q=${q}, sort=${sort}, dir=${dir}, page=${i}, size=${size})}"
                   th:text="${i}"></a>
            </li>
            <li class="page-item" th:classappend="${page == totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/students(q=${q}, sort=${sort}, dir=${dir}, page=${page + 1}, size=${size})}">»</a>
            </li>
        </ul>
    </nav>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
